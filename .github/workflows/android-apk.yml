# v86: Android アプリ（APK）を作る（すするanki と同じ作り）
# 中身は Web 版（GitHub Pages）をそのまま Chrome で全画面表示する Trusted Web Activity。
# 作り直すのはアイコンや名前を変えたいときだけで大丈夫（ゲームの更新は Web 版を更新するだけで届く）。
# 手動で実行: Actions → android-apk → Run workflow。android/ を変えて push したときも作る。
# 署名鍵: Secrets に ANDROID_KEYSTORE_BASE64（.jks を base64 にしたもの）と ANDROID_KEYSTORE_PASSWORD を入れておく
#        （すするanki と同じ鍵を使えば、同じ assetlinks.json の指紋で検証できる。無いときは使い捨ての鍵で署名する）
name: android-apk

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "SUSURU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; else echo "署名鍵が無いので使い捨ての鍵で署名します"; fi
      - name: Build APK
        working-directory: android
        env:
          SUSURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        id: apk
        run: |
          VER=$(grep -oP "GAME_VERSION = '\K[^']+" 01-state-and-config.js)
          OUT="space-ship-simulator-${VER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: space-ship-simulator-apk
          path: ${{ steps.apk.outputs.file }}
