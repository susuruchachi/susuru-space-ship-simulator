<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>宇宙船シミュレーター</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; touch-action: none; }

  #hud-root {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  /* #hud-root > * は直下の子要素に一律pointer-events:autoを
     付ける意図だったが、.hud-touch-controls（全画面inset:0の
     透明ラッパー）もこの直下の子であるため、CSS詳細度の関係で
     後述の「.hud-touch-controls { pointer-events: none; }」が
     このIDセレクタを含むルールに負けて上書きされてしまい、
     ラッパー自体が画面全体でクリック/タッチを奪っていた
     （報告のあったBOOST・ドラッグ操作が根本的に効かない原因）。
     ラッパーだけは対象から明示的に除外する。 */
  #hud-root > *:not(.hud-touch-controls) { pointer-events: auto; }

  .hud-touch-controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .hud-touch-controls > * { pointer-events: auto; }

  /* v27: 画面右下に小さく薄字でバージョン名を表示する。
     #hud-rootの外に置き、pointer-events:noneでタッチ操作を
     一切妨げないようにする（BOOST等のタッチ領域と重ならない
     右下隅だが、念のため）。 */
  #version-label {
    position: fixed;
    right: 8px;
    bottom: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.28);
    font-family: 'Segoe UI', system-ui, sans-serif;
    pointer-events: none;
    z-index: 9999;
    user-select: none;
  }

  .stick-move, .stick-look {
    position: fixed;
    bottom: 32px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    touch-action: none;
  }
  /* v04: stick-moveは左右+上下ストレイフ専用パッド（前後は
     throttle-leverに分離）。throttle-lever(56px) + roll-buttons(56px)
     ぶん右へ寄せる。以前はroll系ボタンとthrottle-leverの位置を
     連動して調整しておらず、throttle-lever追加時にboth共に
     left:32pxのまま縦方向で重なるバグがあった（報告：「前後レバーと
     ロールボタンが重なる」）ため、下部操作系を左から
     throttle-lever → roll-left/right(縦積み) → stick-move の
     横並びで明示的にレイアウトし直した */
  .stick-move { left: 220px; }
  .stick-look { right: 32px; }

  /* v04: スロットルレバー（前進後進）。離しても値を保持する
     「保持型」レバー。stick-move/stick-lookのようなバネ戻り式
     ジョイスティックとは挙動が異なるため専用のドラッグ処理を
     02-input.js側に持つ */
  .throttle-lever {
    position: fixed;
    left: 32px;
    bottom: 32px;
    width: 56px;
    height: 172px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    touch-action: none;
  }
  .throttle-lever::before {
    /* 中央=ゼロ推力の目安線 */
    content: '';
    position: absolute;
    left: 4px;
    right: 4px;
    top: 50%;
    height: 1px;
    background: rgba(255,255,255,0.3);
    transform: translateY(-0.5px);
  }
  .throttle-lever-handle {
    position: absolute;
    left: 4px;
    right: 4px;
    height: 28px;
    border-radius: 6px;
    background: rgba(109,184,255,0.55);
    border: 1px solid rgba(159,216,255,0.8);
    top: 50%;
    transform: translateY(-50%);
  }
  .throttle-lever-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -20px;
    text-align: center;
    font-size: 11px;
    color: #9fd8ff;
  }

  /* v04: throttle-leverの右隣（left:100px〜156px）に縦積み配置。
     以前はbottom:148pxの横並び前提の位置（left:32px/96px）のままで、
     throttle-lever(bottom:32px〜204px)と丸ごと重なっていた */
  .btn-roll-left, .btn-roll-right {
    position: fixed;
    left: 100px;
    width: 56px;
    height: 40px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #cfe8ff;
    font-size: 11px;
    touch-action: none;
  }
  .btn-roll-left { bottom: 122px; }
  .btn-roll-right { bottom: 76px; }

  .btn-boost {
    position: fixed;
    right: 32px;
    bottom: 148px;
    width: 96px;
    height: 40px;
    border-radius: 8px;
    background: rgba(255,140,0,0.18);
    border: 1px solid rgba(255,160,60,0.45);
    color: #ffd9a0;
    font-size: 12px;
    letter-spacing: 0.1em;
    touch-action: none;
  }

  .hud-docking-log-controls { position: fixed; top: 8px; right: 8px; z-index: 9999; display: flex; gap: 6px; }

  .hud-debug-panel {
    position: fixed;
    top: 12px;
    left: 12px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #9fd8ff;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
  }

  /* v42: 設定リンク・進入軸トグル（上段）と航路/航跡トグル（下段）を
     縦に積むための外側コンテナ。右端揃え（設定・進入軸ボタンの
     右端と、その下の航路/航跡ボタンの右端を揃える）にすることで
     「進入軸ボタンの下」という位置関係を作る。 */
  .hud-top-right-col {
    position: fixed;
    top: 12px;
    right: 12px;
    left: 12px; /* 折り返し時に右端で詰まらないよう左端まで確保する */
    display: flex;
    flex-direction: column;
    align-items: flex-end; /* 各行を右端に揃える */
    gap: 8px;
  }

  .hud-top-right-row {
    display: flex;
    flex-direction: row-reverse; /* 設定ボタンを右端(従来位置)に保つ */
    flex-wrap: wrap;
    justify-content: flex-start; /* row-reverse下でのflex-start=右詰め */
    gap: 8px;
    width: 100%;
  }

  .hud-settings-link {
    padding: 8px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: #dfefff;
    font-size: 13px;
    text-decoration: none;
    white-space: nowrap;
  }

  /* v40: 進入軸・目的地ゲートの表示/非表示トグル。
     v41: 予定航路トグルも同じクラスを使う。
     v42: 上段（進入軸）・下段（航路/航跡）の2行構成になった
     （.hud-top-right-col参照、各行はrow-reverse配置で右詰め、
     狭い画面ではflex-wrapで折り返す）。 */
  .btn-approach-guides-toggle {
    padding: 8px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,170,51,0.4);
    border-radius: 6px;
    color: #ffd9a0;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn-approach-guides-toggle.is-off {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
  }

  .hud-camera-controls {
    position: fixed;
    top: 56px;
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .btn-camera-mode {
    padding: 8px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    color: #dfefff;
    font-size: 13px;
  }
  .camera-preset-panel {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    width: 132px;
  }
  .camera-preset-panel button {
    width: 40px;
    height: 32px;
    border-radius: 6px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    color: #cfe8ff;
    font-size: 12px;
  }
  .camera-preset-panel .btn-camera-reset {
    width: 132px;
    height: 30px;
    font-size: 11px;
    color: #ffe9b3;
    border-color: rgba(255,214,140,0.35);
  }
  .camera-pan-hint {
    font-size: 10px;
    color: rgba(223,239,255,0.55);
    text-align: right;
    width: 132px;
    line-height: 1.4;
  }

  .hud-damping-toggle,
  .hud-retro-damping-toggle {
    padding: 8px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(108,195,255,0.4);
    border-radius: 6px;
    color: #9fd8ff;
    font-size: 12px;
    text-align: left;
  }
  .hud-damping-toggle.is-off,
  .hud-retro-damping-toggle.is-off {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
  }

  /* -----------------------------------------------------------
     v09: サイドメニュー（横スライドパネル）
     スマホの狭い横幅でも常設ボタンが並びきらないため、自動制動/
     自動操船/目的地座標入力をここにまとめて収納する。
     タブは画面左端中央に常時表示。パネルはタブの右に隠れており、
     is-openクラスが付くとtransformでスライドインする。
  ----------------------------------------------------------- */
  .hud-side-menu {
    position: fixed;
    top: 168px;
    left: 0;
    display: flex;
    align-items: flex-start;
    z-index: 20;
    /* v85: 入れ物そのものはタップを受けない。閉じていても入れ物の箱（タブ＋隠れた
       パネルの幅・高さ）が残っていて、小さな画面ではその下のスロットルレバーや
       ロールボタン・スティックがさわれなかった。タブと開いたパネルだけが受ける */
    pointer-events: none;
  }
  #hud-root > .hud-side-menu { pointer-events: none; }
  .side-menu-tab { pointer-events: auto; }
  .side-menu-tab {
    width: 36px;
    height: 56px;
    border-radius: 0 8px 8px 0;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(108,195,255,0.4);
    border-left: none;
    color: #9fd8ff;
    font-size: 16px;
    flex-shrink: 0;
  }
  .side-menu-panel {
    width: 220px;
    max-height: min(50vh, 300px);
    overflow-y: auto;
    padding: 14px;
    margin-left: -1px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(108,195,255,0.4);
    border-radius: 0 10px 10px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* v83: 閉じているときは、タブの分（36px）も含めて画面の外へ出して隠す
       （以前は -100% だけずらしていたため、パネルの右端がタブの下に見えていた） */
    transform: translateX(calc(-100% - 40px));
    visibility: hidden;
    transition: transform 0.2s ease, visibility 0s linear 0.2s;
    pointer-events: none;
  }
  .hud-side-menu.is-open .side-menu-panel {
    transform: translateX(0);
    visibility: visible;
    transition: transform 0.2s ease, visibility 0s linear 0s;
    pointer-events: auto;
  }
  .side-menu-section-title {
    color: rgba(159,216,255,0.6);
    font-size: 11px;
    letter-spacing: 0.05em;
    margin-top: 6px;
  }
  .side-menu-section-title:first-child {
    margin-top: 0;
  }
  .side-menu-panel button {
    padding: 8px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(108,195,255,0.4);
    border-radius: 6px;
    color: #9fd8ff;
    font-size: 12px;
    text-align: left;
  }
  .side-menu-panel .btn-docking-toggle.is-on {
    border-color: #6cc3ff;
    background: rgba(108,195,255,0.18);
    color: #dfefff;
  }
  .side-menu-panel .btn-docking-toggle.is-disabled {
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.35);
  }
  .docking-coord-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .docking-coord-row label {
    width: 14px;
    color: #9fd8ff;
    font-size: 12px;
  }
  .docking-coord-row input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(108,195,255,0.4);
    border-radius: 6px;
    color: #dfefff;
    font-size: 12px;
  }

  /* -----------------------------------------------------------
     v83: スマホなど小さな画面のレイアウト
     （幅700px以下＝縦持ち、高さ500px以下＝横持ち）。上部の航法パネル・
     右上のボタン・デバッグ表示、下部の操縦系が重ならないよう並べ直し、
     少し小さくする。デバッグ表示はタップで畳める（最初は畳んだ状態）。
  ----------------------------------------------------------- */
  @media (max-width: 700px), (max-height: 500px) {
    .hud-debug-panel {
      font-size: 10px;
      line-height: 1.4;
      padding: 5px 8px;
      pointer-events: auto;
      max-width: min(270px, 52vw);
    }
    body.hud-debug-collapsed .hud-debug-panel { max-height: 14px; line-height: 14px; overflow: hidden; }
    body.hud-debug-collapsed .hud-docking-log-controls { display: none; }
    .hud-settings-link, .btn-approach-guides-toggle, .btn-camera-mode { padding: 6px 9px; font-size: 11px; }
    .hud-top-right-col { left: auto; gap: 6px; }
    .hud-top-right-row { gap: 6px; }
    .hud-docking-log-controls button { font-size: 10px !important; padding: 3px 6px !important; }
  }
  @media (max-width: 700px) and (min-height: 501px) {
    .space-nav-panel, .space-nav-panel.is-compact {
      left: 6px !important;
      right: 6px !important;
      transform: none !important;
      width: auto !important;
      max-width: none !important;
      top: 6px;
    }
    .hud-top-right-col { top: 76px; right: 6px; max-width: calc(100vw - 12px); }
    .hud-camera-controls { top: 150px; right: 6px; }
    .hud-debug-panel { top: 76px; left: 6px; max-width: calc(100vw - 200px); }
    .hud-docking-log-controls { top: auto; bottom: 236px; right: 6px; }
    .hud-side-menu { top: 210px; }
    .throttle-lever { left: 12px; bottom: 24px; width: 52px; height: 150px; }
    .btn-roll-left, .btn-roll-right { left: 72px; width: 52px; height: 38px; }
    .btn-roll-left { bottom: 70px; }
    .btn-roll-right { bottom: 24px; }
    .stick-move { left: 134px; bottom: 24px; width: 88px; height: 88px; }
    .stick-look { right: 12px; bottom: 24px; width: 88px; height: 88px; }
    .btn-boost { right: 12px; bottom: 124px; width: 88px; }
  }
  @media (max-height: 500px) {
    .hud-top-right-col { top: 4px; right: 6px; max-width: 30vw; }
    .hud-camera-controls { top: 92px; right: 6px; }
    .hud-debug-panel { top: 4px; left: 6px; max-width: 28vw; }
    .hud-docking-log-controls { top: auto; bottom: 150px; right: 6px; }
    .hud-side-menu { top: 52px; }
    .side-menu-panel { max-height: calc(100vh - 64px); overflow-y: auto; }
    .throttle-lever { left: 12px; bottom: 22px; width: 48px; height: 118px; }
    .btn-roll-left, .btn-roll-right { left: 68px; width: 52px; height: 36px; }
    .btn-roll-left { bottom: 66px; }
    .btn-roll-right { bottom: 22px; }
    .stick-move { left: 132px; bottom: 18px; width: 86px; height: 86px; }
    .stick-look { right: 16px; bottom: 18px; width: 86px; height: 86px; }
    .btn-boost { right: 16px; bottom: 114px; width: 86px; height: 34px; }
  }

  /* -----------------------------------------------------------
     v77: 宇宙航行HUD（17-space-hud.js）
  ----------------------------------------------------------- */
  .space-nav-panel {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: min(540px, calc(100vw - 24px));
    padding: 6px 10px 8px;
    background: rgba(0, 8, 20, 0.55);
    border: 1px solid rgba(108, 195, 255, 0.35);
    border-radius: 8px;
    color: #cfe8ff;
    font-size: 12px;
    z-index: 30;
    box-sizing: border-box;
  }
  .space-nav-line {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
  .space-nav-target { color: #ffd9a0; }
  .space-nav-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .space-nav-buttons button,
  .space-nav-buttons select {
    padding: 5px 9px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(108,195,255,0.45);
    border-radius: 6px;
    color: #dfefff;
    font-size: 12px;
  }
  .space-nav-buttons select { max-width: 170px; }
  /* 画面幅が中くらい（iPadなど）: 左上のデバッグ表示と重ならないよう右へ寄せる */
  @media (max-width: 1150px) {
    .space-nav-panel {
      left: auto;
      right: max(12px, calc(50% - 300px));
      transform: none;
      width: min(500px, calc(100vw - 330px));
    }
    .space-nav-buttons select { max-width: 120px; }
  }
  /* コンパクト表示（スマホ・▴ボタン）: 1行の状態表示とアイコンボタンだけ */
  .space-nav-panel.is-compact {
    width: auto;
    max-width: calc(100vw - 16px);
    left: max(50%, 300px);
    right: auto;
    transform: translateX(-50%);
    padding: 4px 6px 5px;
    font-size: 11px;
  }
  .space-nav-panel.is-compact .space-nav-location,
  .space-nav-panel.is-compact .space-nav-target,
  .space-nav-panel.is-compact .space-target-select,
  .space-nav-panel.is-compact .snb-text { display: none; }
  .space-nav-panel.is-compact .space-nav-buttons { margin-top: 3px; gap: 4px; flex-wrap: nowrap; }
  .space-nav-panel.is-compact .space-nav-buttons button { padding: 4px 7px; }
  @media (max-width: 600px) {
    .space-nav-panel.is-compact { left: 50%; }
  }
  .space-nav-buttons button.is-on {
    background: rgba(255,170,51,0.25);
    border-color: rgba(255,190,90,0.8);
    color: #ffe9c4;
  }
  .space-nav-buttons button.is-off { color: rgba(255,255,255,0.4); }

  #hud-root > .space-label-layer,
  #hud-root > .space-warning {
    pointer-events: none;
  }
  .space-label-layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 5;
  }
  .space-label {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 11px;
    color: rgba(200, 225, 255, 0.85);
    text-shadow: 0 0 3px #000, 0 0 2px #000;
    white-space: nowrap;
    display: none;
  }
  .space-label-star { color: #ffe7a8; }
  .space-label-moon { color: rgba(190, 200, 215, 0.8); font-size: 10px; }
  .space-label-dwarf, .space-label-asteroid, .space-label-comet { color: rgba(220, 200, 170, 0.8); font-size: 10px; }
  .space-label.is-target { color: #ffcf7a; font-weight: bold; }
  .space-target-marker {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
  }
  .stm-corner {
    position: absolute;
    width: 8px;
    height: 8px;
    border-color: #ffb547;
    border-style: solid;
    border-width: 0;
  }
  .stm-corner.tl { left: 0; top: 0; border-left-width: 2px; border-top-width: 2px; }
  .stm-corner.tr { right: 0; top: 0; border-right-width: 2px; border-top-width: 2px; }
  .stm-corner.bl { left: 0; bottom: 0; border-left-width: 2px; border-bottom-width: 2px; }
  .stm-corner.br { right: 0; bottom: 0; border-right-width: 2px; border-bottom-width: 2px; }
  .stm-text {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 4px;
    font-size: 11px;
    color: #ffcf7a;
    text-shadow: 0 0 3px #000;
    white-space: nowrap;
  }
  .space-target-arrow {
    position: absolute;
    left: 0;
    top: 0;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    color: #ffb547;
    font-size: 18px;
    text-shadow: 0 0 4px #000;
    display: none;
  }
  .space-warning {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 14px;

<script>
// =============================================================
// メインエントリポイント
// =============================================================

let renderer, scene, camera;
let clock;

function initScene() {
  scene = new THREE.Scene();
  // v77: 背景は宇宙（Universe）側で描くため、ローカルシーンには背景色を
  // 設定しない（Three.jsは背景色があると描画のたびに画面を塗りつぶしてしまう）。
  scene.background = null;

  camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 100000
  );

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  // 宇宙（星空・天体）→ 艦などのローカルシーン、の順に重ねて描くため自動クリアを切る
  renderer.autoClear = false;
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);

  // v77: 以前はランダムな点を並べた簡易的な星空と固定の照明だったが、
  // 実在の星表・天の川・太陽系の天体（15-universe-render.js）に置き換えた。
  // 照明も太陽の実際の方向から当たる（地球の影に入れば暗くなる）。
  SimClock.resetToNow();
  SolarSystem.init();
  const maxTex = renderer.capabilities.maxTextureSize >= 8192 ? '4k' : '2k';
  // 銀河系モデルの点の数（タッチ端末は控えめに。?galaxyPoints=N で上書き可）
  const isTouch = (navigator.maxTouchPoints || 0) > 0;
  const gpParam = parseInt(new URLSearchParams(location.search).get('galaxyPoints'), 10);
  const galaxyPoints = Number.isFinite(gpParam) ? gpParam : (isTouch ? 50000 : 90000);
  Universe.init(renderer, { maxTexture: maxTex, galaxyPoints });
  Universe.initLocalLights(scene);

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  PostFx.setSize(renderer);
}

// v01時点では仮の箱メッシュ。実艦モデル(GLB/OBJ)は艦船建造画面
// (ship-builder.html)で保存されていればそちらに差し替える
function createPlaceholderShipMesh(classKey) {
  const sizeByClass = {
    rocket: { x: 2, y: 2, z: 8 },
    cruiser: { x: 12, y: 8, z: 60 },
    battleship: { x: 24, y: 18, z: 140 },
  };
  const s = sizeByClass[classKey] ?? sizeByClass.rocket;
  const geo = new THREE.BoxGeometry(s.x, s.y, s.z);
  const mat = new THREE.MeshStandardMaterial({ color: 0x6688aa, metalness: 0.4, roughness: 0.5 });
  return new THREE.Mesh(geo, mat);
}

// -------------------------------------------------------------
// 保存済みモデル(spaceSimShipModel:<classKey>)の読み込みと差し替え
//
// spawnPlayerShip()はThree.jsオブジェクトを同期的に要求する一方、
// GLB/OBJの読み込みは非同期になるため、艦の「見た目のルート」は
// 常にTHREE.Group（shipVisualRoot）とし、
//   shipVisualRoot
//     └ placeholderMesh（起動直後は表示、モデル読み込み完了で除去）
//     └ modelCorrectionGroup（ship-builder.htmlと同じ役割。
//         保存された回転/スケール/位置オフセットをここに適用し、
//         その子として実際に読み込んだモデルを追加する）
// という2段構成にする。ShipController._syncMesh()はshipVisualRoot
// のquaternion/positionを毎フレーム直接上書きするだけなので、
// 内部構造をこの後から差し替えても物理・操作系には影響しない。
// -------------------------------------------------------------
function createShipVisualRoot(classKey) {
  const root = new THREE.Group();
  // v78: 自作の艦は重心が船体の中心からずれることがあるため、見た目全体を
  // 「重心 → 船体の中心」のぶんずらす中間ノードを挟む（艦種プリセットは原点のまま）。
  const designOffset = new THREE.Group();
  root.add(designOffset);

  const placeholder = createPlaceholderShipMesh(classKey);
  designOffset.add(placeholder);

  const correction = new THREE.Group();
  designOffset.add(correction);

  root.userData.designOffset = designOffset;
  root.userData.placeholderMesh = placeholder;
  root.userData.correctionGroup = correction;
  return root;
}

// v79: 艦の見た目（仮の箱・読み込んだモデル）が変わったら、当たり判定の形を作り直す
function refreshShipCollisionShape(root) {
  if (typeof Collision === 'undefined' || typeof computeCollisionShape !== 'function') return;
  try {
    Collision.setShipShape(computeCollisionShape(root, root, 48));
  } catch (err) {
    console.warn('艦の当たり判定の作成に失敗しました。', err);
  }
}

// v78: 保存されたモデルデータ（GLB/OBJ）からThree.jsのオブジェクトを作る。
// GLBのdata URLは、iPadで巨大なdata URLをfetchすると失敗する問題（v67）を
// 避けるため、atobで直接デコードする（dataUrlToArrayBuffer）。
function parseShipModelData(data) {
  return new Promise((resolve, reject) => {
    try {
      if (data.format === 'glb') {
        const buf = dataUrlToArrayBuffer(data.glbDataUrl);
        const manager = new THREE.LoadingManager();
        const loader = new THREE.GLTFLoader(manager);
        loader.textureLoader = new THREE.TextureLoader(manager);
        // v84: 光る面の強さ（ブルーム用）を反映（01-state-and-config.js applyEmissiveStrength）
        loader.parse(buf, '', (gltf) => { applyEmissiveStrength(gltf.scene); resolve(gltf.scene); }, reject);
      } else if (data.format === 'obj') {
        let materials = null;
        if (data.mtlText) {
          const texMap = data.textures || {};
          const manager = new THREE.LoadingManager();
          manager.setURLModifier((url) => {
            const baseName = url.split('/').pop().split('\\').pop();
            return texMap[baseName] || url;
          });
          materials = new THREE.MTLLoader(manager).parse(data.mtlText, '');
          materials.preload();
        }
        const objLoader = new THREE.OBJLoader();
        if (materials) objLoader.setMaterials(materials);
        resolve(objLoader.parse(data.objText));
      } else {
        reject(new Error(`未対応のモデル形式: ${data.format}`));
      }
    } catch (e) {
      reject(e);
    }
  });
}

// -------------------------------------------------------------
// v78: 自作の艦（21-ship-design.js）を反映する。物理パラメータは即座に、
// 見た目（船体モデル）は読み込みが終わりしだい差し替える。
// -------------------------------------------------------------
async function applyShipDesignInGame(ship, root, design) {
  const spec = applyShipDesignToShip(ship, design);
  const c = spec.cog;
  root.userData.designOffset.position.set(-c.x, -c.y, -c.z);

  // 接舷面: 船体の中心は重心から -cog のところにある
  ship.dockingFace = design.dockingFace || null;
  ship.dockingFaceBoxHalfExtents = { x: spec.dims.x / 2, y: spec.dims.y / 2, z: spec.dims.z / 2 };
  ship.dockingFaceBoxCenter = { x: -c.x, y: -c.y, z: -c.z };

  // 見た目の大きさに合わせてカメラ・噴射の表現を調整
  if (typeof CameraSystem !== 'undefined' && CameraSystem.setShipSize) CameraSystem.setShipSize(spec.size);
  ship.fxScale = Math.max(1, spec.size / 8);

  // 仮の箱を設計の寸法に作り直す（モデルがあれば読み込み後に消す）
  const old = root.userData.placeholderMesh;
  if (old) {
    root.userData.designOffset.remove(old);
    old.geometry.dispose();
  }
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(spec.dims.x, spec.dims.y, spec.dims.z),
    new THREE.MeshStandardMaterial({ color: 0x6688aa, metalness: 0.4, roughness: 0.5 })
  );
  root.userData.designOffset.add(box);
  root.userData.placeholderMesh = box;
  refreshShipCollisionShape(root);

  if (!design.hull.hasModel) return;
  const data = await loadShipDesignModel(design.id);
  if (!data) return;
  try {
    const obj = await parseShipModelData(data);
    const corr = root.userData.correctionGroup;
    const h = design.hull;
    const toRad = (d) => (d * Math.PI) / 180;
    corr.rotation.set(toRad(h.rotationDeg.x), toRad(h.rotationDeg.y), toRad(h.rotationDeg.z));
    corr.scale.setScalar(h.scale);
    corr.position.set(h.offset.x, h.offset.y, h.offset.z);
    corr.add(obj);
    root.userData.designOffset.remove(box);
    box.geometry.dispose();
    root.userData.placeholderMesh = null;
    refreshShipCollisionShape(root);
  } catch (err) {
    console.warn(`艦の設計「${design.name}」のモデル読み込みに失敗しました。仮の船体のままにします。`, err);
  }
}

// v61: 第3引数shipは、モデル読み込み完了後に接舷面(dockingFace)情報を
// 反映するために渡す（省略時=保存モデルが無い等は従来通りdockingFaceは
// nullのまま）。読み込み自体は非同期のため、initGame()側でship生成
// （ShipController.spawnPlayerShip）を済ませてからこの関数を呼ぶ順序に
// 変更している。
async function loadSavedShipModelInto(root, classKey, ship) {
  const saved = await loadShipModelData(classKey);
  if (!saved) return; // 保存が無ければ箱のまま

  const toRad = (d) => (d * Math.PI) / 180;
  const applyAdjust = (obj) => {
    obj.rotation.set(
      toRad(saved.adjust.rotationDeg.x),
      toRad(saved.adjust.rotationDeg.y),
      toRad(saved.adjust.rotationDeg.z)
    );
    obj.scale.setScalar(saved.adjust.scale);
    obj.position.set(saved.adjust.offset.x, saved.adjust.offset.y, saved.adjust.offset.z);
  };

  const onLoaded = (loadedObject) => {
    // 読み込みが成功した時点で初めて箱を消す。読み込み失敗時は
    // 箱のまま操縦できる状態を維持し、無操作の艦にならないようにする
    const placeholder = root.userData.placeholderMesh;
    if (placeholder && placeholder.parent) {
      placeholder.parent.remove(placeholder);
    }
    root.userData.correctionGroup.add(loadedObject);
    applyAdjust(root.userData.correctionGroup);
    refreshShipCollisionShape(root);

    // v61: 接舷面(dockingFace)が保存されていれば艦の状態へ反映する。
    // バウンディングボックスは補正後(rotation/scale/offset適用後)の
    // correctionGroupから計算する（ship-builder.html側の6面選択・
    // 自動フィットと基準を一致させるため）。
    if (saved.dockingFace) {
      ship.dockingFace = saved.dockingFace;
      const box = new THREE.Box3().setFromObject(root.userData.correctionGroup);
      if (!box.isEmpty()) {
        const size = new THREE.Vector3();
        box.getSize(size);
        ship.dockingFaceBoxHalfExtents = { x: size.x / 2, y: size.y / 2, z: size.z / 2 };
      }
    } else {
      ship.dockingFace = null;
    }
  };

  // v78: GLB/OBJの読み込みは parseShipModelData に共通化（GLBはfetchを
  // 使わずに読み込むので、iPadで巨大なモデルが読めない問題も避けられる）
  try {
    onLoaded(await parseShipModelData(saved));
  } catch (err) {
    console.warn(`艦モデル(${classKey})の読み込みに失敗しました。仮メッシュのままにします。`, err);
  }
}

function initGame() {
  const params = new URLSearchParams(location.search);
  const persisted = loadPersistedSettings();

  // 優先順位: URLパラメータ（settings.htmlの「開始」ボタンから明示指定）
  // → localStorage（前回の設定）→ コード内デフォルト
  const requestedClass = params.get('class') || persisted.shipClass || 'rocket';
  // 保存値・URLパラメータどちらも不正な艦種キーの可能性があるため、
  // 存在確認の上でフォールバックする（createShipState()の例外を防ぐ）
  const shipClass = ShipClassPresets[requestedClass] ? requestedClass : 'rocket';

  const mesh = createShipVisualRoot(shipClass);
  scene.add(mesh);

  // v61: 接舷面(dockingFace)情報をshipへ反映するため、モデル読み込みを
  // 開始する前にship自体を生成しておく（生成順を入れ替え）。
  const ship = ShipController.spawnPlayerShip(shipClass, mesh, { x: 0, y: 0, z: 0 });
  // v78: 自作の艦（設計）が選ばれていればそれを使う。読み込みは非同期なので、
  // それまでは艦種プリセットのまま（停止中なので切り替わっても影響はない）。
  refreshShipCollisionShape(mesh); // 仮の箱（モデルを読み込んだら作り直す）
  const designId = params.get('design') || persisted.shipDesignId;
  if (params.get('design')) savePersistedSettings({ shipDesignId: designId });
  if (designId) {
    loadShipDesign(designId).then((design) => {
      if (design) applyShipDesignInGame(ship, mesh, design);
      else loadSavedShipModelInto(mesh, shipClass, ship);
    });
  } else {
    loadSavedShipModelInto(mesh, shipClass, ship);
  }

  // v77: 母港（地球の高度2,000km）を基準にした座標系を用意する。
  // 艦・ポートのローカル座標は従来どおりで、その原点が地球周回軌道上にある。
  Navigation.init();

  const capParam = params.get('speedCapMode');
  const effectiveCapMode =
    (capParam === SpeedCapMode.HARD_CAP || capParam === SpeedCapMode.SOFT_GLOW)
      ? capParam
      : persisted.speedCapMode; // null であればship側デフォルトに従う（getEffectiveSpeedCapMode参照）
  if (effectiveCapMode) {
    State.settings.speedCapModeOverride = effectiveCapMode;
  }

  const debugHudParam = params.get('debugHud');
  State.settings.showDebugHud =
    debugHudParam !== null ? debugHudParam === '1' : persisted.showDebugHud;

  // cameraMode / autoDampingEnabled / retroDampingEnabled は
  // settings.htmlを経由せず、ゲーム内のHUDボタンで直接切り替える運用
  // （切り替えた瞬間にsavePersistedSettings()で保存され、次回起動時に
  // ここで復元される）
  State.settings.cameraMode = persisted.cameraMode ?? 'chase';
  State.settings.autoDampingEnabled = persisted.autoDampingEnabled ?? true;
  // v10: 並進制動（逆噴射用SRC）専用トグル。自動姿勢制動とは独立に
  // 永続化・復元する。
  State.settings.retroDampingEnabled = persisted.retroDampingEnabled ?? true;
  // v40: 進入軸・目的地ゲートの可視化表示/非表示。cameraMode等と
  // 同じくゲーム内HUDのトグルボタンで直接切り替え、その場で永続化する運用。
  State.settings.showApproachGuides = persisted.showApproachGuides ?? true;
  // v41: 予定航路の線の表示/非表示。showApproachGuidesとは別トグル。
  State.settings.showRouteLine = persisted.showRouteLine ?? true;
  // v08: RCS最大出力の主機推力に対する上限比率。settings.htmlのみで
  // 変更する運用（ゲーム内HUDには専用UIを設けない）。
  State.settings.rcsThrustCapRatio = persisted.rcsThrustCapRatio ?? 1.0;
  // v84: 光のにじみ（ブルーム）。settings.html で切り替える（?bloom=0/1 で上書き可）
  const bloomParam = params.get('bloom');
  State.settings.bloomEnabled = bloomParam !== null ? bloomParam === '1' : (persisted.bloomEnabled ?? true);
  PostFx.init(renderer, State.settings.bloomEnabled);

  // v08: 入港（オートドッキング）目的地の復元。settings.htmlを
  // 経由せず、HUDの「ここを目的地として保存」ボタンで設定・
  // localStorageへ永続化される（cameraMode等と同じ運用）。
  State.dockingTarget = loadDockingTarget();

  // このセッションで確定した設定をlocalStorageへ書き戻す。
  // これにより、settings.htmlを次に開いたときも「前回選んだ内容」が
  // 初期選択状態として反映される（以前は毎回コード内デフォルトに
  // リセットされていた）。
  savePersistedSettings({
    shipClass,
    speedCapMode: effectiveCapMode ?? null,
    showDebugHud: State.settings.showDebugHud,
    cameraMode: State.settings.cameraMode,
    autoDampingEnabled: State.settings.autoDampingEnabled,
    retroDampingEnabled: State.settings.retroDampingEnabled,
    rcsThrustCapRatio: State.settings.rcsThrustCapRatio,
    bloomEnabled: State.settings.bloomEnabled,
    showApproachGuides: State.settings.showApproachGuides,
    showRouteLine: State.settings.showRouteLine,
  });

  const hudRoot = document.getElementById('hud-root');
  // 呼び出し順が重要: HUD.init()が先にタッチスティック用のDOM要素
  // （.stick-move / .stick-look等）を生成しないと、InputSystem.init()の
  // querySelectorが要素を見つけられずタッチ入力が一切バインドされない
  // （バグとして報告：「タッチ操作が効かない」）
  HUD.init(hudRoot);
  SpaceHud.init(hudRoot);
  InputSystem.init(hudRoot);
  EngineFx.init(scene);
  CameraSystem.init(renderer.domElement);
  DockingPlatform.init(scene);
  ApproachVisualizer.init(scene);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // タブ切り替え等の大ジャンプ対策

  // v77: 宇宙の時刻を進め、太陽系の天体の位置・自転を更新してから艦を動かす
  SimClock.update(dt);
  SolarSystem.update(SimClock.jd);

  ShipController.update(dt);
  Navigation.postUpdate();
  EngineFx.update(dt, camera, renderer);
  CameraSystem.update(camera);
  DockingPlatform.update();
  ApproachVisualizer.update();

  // 宇宙の視点（カメラの宇宙座標・向き）を渡して、星空と天体を更新。
  // 星図を開いている間は星図のカメラで描く。
  const mapOpen = StarMap.isOpen();
  if (mapOpen) StarMap.update(dt);
  else Universe.setView(Navigation.buildView(camera));
  Universe.update(window.innerWidth, window.innerHeight, renderer.getPixelRatio());
  if (State.ship) {
    Universe.updateLocalLights(Navigation.frame.rotT, Navigation.shipUniverse(), State.ship.position);
    const fwd = Astro.mat3MulVec(Navigation.frame.rot, rotateVecByQuat({ x: 0, y: 0, z: -1 }, State.ship.quaternion));
    Universe.setWarpEffect(Navigation.isWarping() ? Navigation.warp.speed : 0, fwd, dt);
  }

  HUD.update();
  SpaceHud.update();

  if (mapOpen) {
    renderer.setRenderTarget(null);
    renderer.clear();
    Universe.render(renderer);
    StarMap.postRender();
  } else {
    // v84: ブルームが有効なら画面外に描いてから、明るい部分をにじませて画面へ（26-post-fx.js）
    PostFx.render(renderer, () => {
      renderer.clear();
      Universe.render(renderer);
      renderer.clearDepth();
      renderer.render(scene, camera);
    });
  }
}

initScene();
initGame();
clock = new THREE.Clock();

// v27: 右下バージョン表示。GAME_VERSION定数（01-state-and-config.js）を
// そのままテキストに反映するだけなので、他の画面（settings.html等）
// でも同じ要素id・定数を使えば流用できる。
const versionLabelEl = document.getElementById('version-label');
if (versionLabelEl) versionLabelEl.textContent = GAME_VERSION;
document.title = `宇宙船シミュレーター ${GAME_VERSION}`;

animate();
</script>

</body>
