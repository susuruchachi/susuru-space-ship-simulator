<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ドッキングポート設定 - 宇宙船シミュレーター</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070c;
    color: #dfefff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* -----------------------------------------------------------
     レイアウト: 上部バー / メイン領域(一覧 or 編集) / 下部操作パネル
     ship-builder.htmlと同じく、モバイル(縦持ち)を主眼にした構成。
  ----------------------------------------------------------- */
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    background: rgba(8,11,18,0.9);
    z-index: 5;
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
  }
  .link-back {
    font-size: 12px;
    color: #9fb3c8;
    text-decoration: none;
    padding: 6px 8px;
  }

  #buildVersionLine {
    text-align: right;
    font-size: 10px;
    color: rgba(159,179,200,0.5);
    padding: 2px 14px 0;
  }

  /* -----------------------------------------------------------
     一覧画面
  ----------------------------------------------------------- */
  .list-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
  }
  .list-wrap.hidden { display: none; }

  .port-empty {
    text-align: center;
    padding: 40px 20px;
    color: #9fb3c8;
  }
  .port-empty .icon { font-size: 36px; opacity: 0.6; margin-bottom: 10px; }
  .port-empty p { font-size: 13px; line-height: 1.6; margin: 0; }

  .port-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 10px;
  }
  .port-card.active {
    border-color: #6cc3ff;
    background: rgba(108,195,255,0.1);
  }
  .port-card .info { flex: 1 1 auto; min-width: 0; }
  .port-card .name {
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .port-card .coords {
    font-size: 11px;
    color: #9fb3c8;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .port-card .active-badge {
    font-size: 10px;
    color: #6cc3ff;
    background: rgba(108,195,255,0.14);
    border: 1px solid rgba(108,195,255,0.35);
    padding: 2px 7px;
    border-radius: 999px;
    margin-top: 5px;
    display: inline-block;
  }
  .port-card .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
  }
  .port-card button {
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06);
    color: #dfefff;
    white-space: nowrap;
  }
  .port-card .btn-use {
    border-color: #3a8fd6;
    background: rgba(58,143,214,0.18);
    color: #bfe0ff;
  }
  .port-card .btn-use:disabled {
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    color: rgba(223,239,255,0.35);
  }

  .add-port-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px dashed rgba(108,195,255,0.4);
    background: rgba(108,195,255,0.05);
    color: #6cc3ff;
    font-size: 13px;
    font-weight: 600;
    margin-top: 6px;
  }

  /* -----------------------------------------------------------
     編集画面（プレビュー + 調整パネル、ship-builder.htmlと同じ骨格）
  ----------------------------------------------------------- */
  .editor-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .editor-wrap.hidden { display: none; }

  .viewport-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }
  #viewportCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .viewport-hint {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 11px;
    color: rgba(223,239,255,0.55);
    pointer-events: none;
    line-height: 1.5;
  }

  .adjust-panel {
    flex: 0 0 auto;
    max-height: 50vh;
    overflow-y: auto;
    background: rgba(8,11,18,0.95);
    border-top: 1px solid rgba(255,255,255,0.12);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  }

  .adjust-section { margin-bottom: 18px; }
  .adjust-section:last-child { margin-bottom: 0; }
  .adjust-section h2 {
    font-size: 11px;
    color: #9fd8ff;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 10px;
  }

  .name-input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #dfefff;
    font-size: 13px;
  }

  .axis-row {
    display: grid;
    grid-template-columns: 22px 1fr 64px;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .axis-row .axis-label {
    font-size: 12px;
    font-weight: 700;
    color: #6cc3ff;
    text-align: center;
  }
  .axis-row input[type="range"] { width: 100%; }
  .axis-row input[type="number"] {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #dfefff;
    font-size: 12px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .quick-rot-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .quick-rot-row button {
    flex: 1 1 auto;
    min-width: 70px;
    padding: 8px 6px;
    font-size: 11px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.05);
    color: #dfefff;
  }
  .quick-rot-row button:active { background: rgba(108,195,255,0.18); }

  .reset-link {
    font-size: 11px;
    color: #ff9d9d;
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
  }

  .footer-bar {
    flex: 0 0 auto;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(5,7,12,0.95);
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .btn-primary { background: #3a8fd6; color: #fff; }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #dfefff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-danger {
    background: rgba(255,80,80,0.12);
    color: #ff9d9d;
    border: 1px solid rgba(255,80,80,0.3);
  }
</style>
</head>
<body>

<div id="app">

  <div class="topbar">
    <a class="link-back" href="settings.html">&lt; 設定へ戻る</a>
    <h1 id="topbarTitle">ドッキングポート設定</h1>
    <div style="width:56px;"></div>
  </div>
  <div id="buildVersionLine"></div>

  <!-- 一覧画面 -->
  <div class="list-wrap" id="listWrap">
    <div class="port-empty hidden" id="portEmptyState">
      <div class="icon">🛰️</div>
      <p>保存されたドッキングポートがまだありません。<br>「新しいポートを作成」から追加してください。</p>
    </div>
    <div id="portList"></div>
    <button class="add-port-btn" id="addPortBtn" type="button">+ 新しいポートを作成</button>
  </div>

  <!-- 編集画面 -->
  <div class="editor-wrap hidden" id="editorWrap">
    <div class="viewport-wrap">
      <canvas id="viewportCanvas"></canvas>
      <div class="viewport-hint">ドラッグ: 視点回転 / ピンチ・ホイール: ズーム</div>
    </div>

    <div class="adjust-panel">
      <div class="adjust-section">
        <h2>ポート名</h2>
        <input type="text" class="name-input" id="portNameInput" placeholder="例: 母港ステーション、補給ポイントA">
      </div>

      <div class="adjust-section">
        <h2>位置（ワールド座標）</h2>
        <div class="axis-row">
          <div class="axis-label">X</div>
          <input type="range" id="posX" min="-2000" max="2000" step="1" value="0">
          <input type="number" id="posXNum" step="1" value="0">
        </div>
        <div class="axis-row">
          <div class="axis-label">Y</div>
          <input type="range" id="posY" min="-2000" max="2000" step="1" value="0">
          <input type="number" id="posYNum" step="1" value="0">
        </div>
        <div class="axis-row">
          <div class="axis-label">Z</div>
          <input type="range" id="posZ" min="-2000" max="2000" step="1" value="0">
          <input type="number" id="posZNum" step="1" value="0">
        </div>
      </div>

      <div class="adjust-section">
        <h2>向き（艦がこの姿勢で進入する）</h2>
        <div class="axis-row">
          <div class="axis-label">P</div>
          <input type="range" id="rotPitch" min="-180" max="180" step="1" value="0">
          <input type="number" id="rotPitchNum" step="1" value="0">
        </div>
        <div class="axis-row">
          <div class="axis-label">Y</div>
          <input type="range" id="rotYaw" min="-180" max="180" step="1" value="0">
          <input type="number" id="rotYawNum" step="1" value="0">
        </div>
        <div class="axis-row">
          <div class="axis-label">R</div>
          <input type="range" id="rotRoll" min="-180" max="180" step="1" value="0">
          <input type="number" id="rotRollNum" step="1" value="0">
        </div>
        <div class="quick-rot-row">
          <button type="button" data-quick="yaw180">Y+180°（前後反転）</button>
        </div>
      </div>

      <div class="adjust-section">
        <button class="reset-link" id="deletePortBtn" type="button">このポートを削除</button>
      </div>
    </div>

    <div class="footer-bar">
      <button class="btn btn-secondary" id="cancelEditBtn" type="button">キャンセル</button>
      <button class="btn btn-primary" id="savePortBtn" type="button">このポートを保存</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="01-state-and-config.js"></script>
<script src="10-docking-platform.js"></script>
<script src="12-port-builder.js"></script>
</body>
</html>
